name: tolo-idp-dev

services:
  app:
    image: tolo-idp:0.0.1-SNAPSHOT
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tolo_idp
      SPRING_DATASOURCE_USERNAME: tolo_idp
      SPRING_DATASOURCE_PASSWORD: tolo_idp
      SPRING_FLYWAY_LOCATIONS: classpath:db/postgresql
      TOLO_IDP_ISSUER: http://localhost:18080
      TOLO_IDP_RATE_LIMIT_REDIS_URI: redis://redis:6379
      TOLO_IDP_SEED_ENABLED: "true"
      TOLO_IDP_JWK_ALLOW_EPHEMERAL: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: tolo_idp
      POSTGRES_USER: tolo_idp
      POSTGRES_PASSWORD: tolo_idp
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  runn:
    image: ghcr.io/k1low/runn:v1.10.0-slim
    profiles:
      - scenario
    # イメージの entrypoint.sh は `runn $@` と引用符なしで展開するため、空白を含む
    # --host-rules の値が分割される。runn を直接呼ぶ。
    entrypoint: ["runn"]
    command: ["run", "--verbose", "--host-rules", "localhost app:8080", "/books/**/*.yml"]
    environment:
      IDP_ISSUER: http://localhost:18080
    volumes:
      - ./scenario:/books:ro
    depends_on:
      app:
        condition: service_started
    restart: "no"

volumes:
  postgres-dev-data:
  redis-dev-data:
