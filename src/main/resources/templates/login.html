<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 2rem 1rem; background: #f5f5f5; }
        main { max-width: 24rem; margin: 4rem auto; padding: 1.5rem; background: white; border-radius: .5rem; }
        h1 { margin-top: 0; font-size: 1.5rem; }
        label { display: block; margin-top: 1rem; }
        input, button { box-sizing: border-box; width: 100%; margin-top: .4rem; padding: .7rem; font: inherit; }
        button { cursor: pointer; margin-top: 1.5rem; }
        #status { min-height: 1.5rem; margin-bottom: 0; }
    </style>
</head>
<body>
<main>
    <h1>ログイン</h1>
    <form id="login-form" th:attr="data-continue-url=${continueUrl}">
        <label>
            ユーザー名
            <input name="username" autocomplete="username" required>
        </label>
        <label>
            パスワード
            <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <label>
            Tenant ID
            <input name="tenantId" autocomplete="off" required>
        </label>
        <button type="submit">ログイン</button>
        <p id="status" role="status" aria-live="polite"></p>
    </form>
</main>
<script>
    const form = document.getElementById('login-form');
    const status = document.getElementById('status');
    const button = form.querySelector('button');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        button.disabled = true;
        status.textContent = 'ログイン中…';

        const fields = new FormData(form);
        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: fields.get('username'),
                    password: fields.get('password'),
                    tenantId: fields.get('tenantId')
                })
            });
            if (!response.ok) {
                throw new Error('Login failed');
            }
            if (form.dataset.continueUrl) {
                window.location.assign(form.dataset.continueUrl);
                return;
            }
            status.textContent = 'ログインしました。';
        } catch (_) {
            status.textContent = 'ログインできませんでした。入力内容を確認してください。';
        } finally {
            button.disabled = false;
        }
    });
</script>
</body>
</html>
